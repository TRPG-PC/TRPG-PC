<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PC汇总</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #eef2f9;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(210, 230, 255, 0.6) 0%, transparent 30%),
      radial-gradient(circle at 90% 70%, rgba(220, 240, 255, 0.7) 0%, transparent 40%),
      linear-gradient(135deg, #f0f4fe 0%, #ffffff 100%);
    font-family: 'Segoe UI', 'Microsoft YaHei', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
    min-height: 100vh;
    -webkit-text-size-adjust: 100%;
  }

  .app {
    max-width: 1400px;
    width: 100%;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 2.5rem;
    padding: 2rem 1.8rem;
    box-shadow: 0 25px 50px -8px rgba(0,0,0,0.12), 0 0 0 1px rgba(255,255,255,0.6) inset;
    border: 1px solid rgba(255, 255, 255, 0.8);
  }

  .title-section {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .editable-title {
    font-size: 2.4rem;
    font-weight: 700;
    color: #2c2c3a;
    letter-spacing: 1px;
    padding: 0.2rem 0.6rem;
    border-radius: 1rem;
    outline: none;
    border: 2px dashed transparent;
    transition: 0.15s;
    background: rgba(255, 255, 255, 0.6);
    flex: 1;
    min-width: 200px;
  }
  .editable-title:focus {
    border-color: #b0c4de;
    background: rgba(255,255,255,0.95);
    box-shadow: 0 0 0 4px rgba(180, 200, 240, 0.3);
  }
  .editable-title:hover { border-color: #d0ddef; }

  .toolbar { display: flex; gap: 0.8rem; flex-wrap: wrap; align-items: center; }

  .btn {
    background: rgba(255, 255, 255, 0.85);
    border: none;
    border-radius: 2.5rem;
    padding: 0.65rem 1.4rem;
    font-weight: 600;
    font-size: 0.95rem;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    color: #2c2c3a;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    border: 1px solid rgba(255,255,255,0.9);
    transition: all 0.15s;
    white-space: nowrap;
    font-family: inherit;
  }
  .btn:hover {
    background: #ffffff;
    border-color: #b8c6e0;
    transform: translateY(-1px);
    box-shadow: 0 10px 18px -6px rgba(150, 170, 210, 0.4);
  }

  .btn-primary {
    background: #5a6b8c;
    color: white;
    border-color: #5a6b8c;
  }
  .btn-primary:hover { background: #4a5a78; }

  .table-wrapper {
    overflow-x: auto;
    margin: 0.5rem 0 0.8rem;
    border-radius: 1.8rem;
    background: rgba(255, 255, 255, 0.5);
    padding: 0.6rem;
    border: 1px solid rgba(255,255,255,0.8);
    box-shadow: 0 8px 20px -8px rgba(0,0,0,0.1);
  }

  .ho-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0.8rem 0.6rem;
    table-layout: fixed;
    min-width: 900px;
  }
  .ho-table tbody tr { background: transparent; }

  .cell-card {
    background: rgba(255, 255, 255, 0.8);
    border-radius: 1.8rem;
    padding: 0.9rem 0.9rem 0.9rem;
    box-shadow: 0 8px 18px -8px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(255,255,255,0.9);
    height: auto;
    min-height: 0;
    position: relative;
  }
  .cell-card:hover {
    border-color: #c0cce0;
    box-shadow: 0 12px 22px -10px rgba(120, 140, 180, 0.3);
    background: #ffffff;
  }

  .ho-label {
    font-weight: 700;
    font-size: 1rem;
    color: #2c2c3a;
    background: rgba(240, 244, 255, 0.9);
    padding: 0.4rem 1rem;
    border-radius: 2rem;
    display: inline-block;
    outline: none;
    border: 1px solid rgba(255,255,255,0.9);
    min-width: 80px;
    max-width: 100%;
    word-break: break-word;
  }
  .ho-label:focus {
    border-color: #8fa8cc;
    background: white;
    box-shadow: 0 0 0 3px rgba(150, 170, 210, 0.3);
  }
  .ho-label:hover { background: rgba(235, 240, 255, 0.95); }

  .avatar-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 0.5rem;
  }

  .avatar-preview {
    width: 100%;
    aspect-ratio: 1/1;
    max-width: 120px;
    border-radius: 50%;
    background: rgba(240, 244, 255, 0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: pointer;
    border: 3px solid rgba(255,255,255,0.95);
    box-shadow: 0 6px 14px rgba(0,0,0,0.08);
    margin: 0 auto;
  }
  .avatar-preview:hover { border-color: #b0c4de; }
  .avatar-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .avatar-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #8a9bb8;
    font-size: 0.72rem;
    gap: 6px;
  }
  .icon-cam {
    width: 36px;
    height: 28px;
    border: 2px solid #8a9bb8;
    border-radius: 6px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-cam::before {
    content: '';
    width: 12px;
    height: 12px;
    border: 2px solid #8a9bb8;
    border-radius: 50%;
  }
  .icon-cam::after {
    content: '';
    position: absolute;
    top: -5px;
    left: 50%;
    transform: translateX(-50%);
    width: 14px;
    height: 5px;
    background: #8a9bb8;
    border-radius: 3px 3px 0 0;
  }

  .module-row {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    margin-top: 0.2rem;
    background: rgba(245, 248, 255, 0.9);
    border-radius: 2rem;
    padding: 0.1rem 0.3rem 0.1rem 0.6rem;
    border: 1px solid rgba(255,255,255,0.6);
  }

  .status-selector {
    background: transparent;
    border: none;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 0.3rem 0.6rem;
    border-radius: 1.2rem;
    cursor: pointer;
    outline: none;
    flex-shrink: 0;
    font-family: inherit;
    transition: all 0.2s;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    text-align: center;
    min-width: 70px;
  }
  .status-selector.status-pass {
    background: #dcf5e3; color: #1f7a44; border: 1px solid #a9e0be;
  }
  .status-selector.status-fail {
    background: #fde0e0; color: #b33535; border: 1px solid #f5b5b5;
  }
  .status-selector.status-scatter {
    background: #ffeacc; color: #b56d15; border: 1px solid #f5cfa0;
  }
  .status-selector.status-satellite {
    background: #e4e0fb; color: #5a44b8; border: 1px solid #c3b8f0;
  }
  .status-selector option { background: #ffffff; color: #2c2c3a; font-weight: 500; }

  .module-input {
    border: none;
    background: transparent;
    padding: 0.45rem 0.2rem;
    font-size: 0.9rem;
    font-weight: 500;
    color: #2c2c3a;
    width: 100%;
    outline: none;
    border-bottom: 2px solid transparent;
    font-family: inherit;
    min-width: 0;
  }
  .module-input:focus { border-bottom-color: #8fa8cc; }
  .module-input::placeholder { color: #a8b6cc; font-size: 0.8rem; }

  .pc-input {
    border: none;
    background: rgba(245, 248, 255, 0.9);
    border-radius: 2rem;
    padding: 0.5rem 0.8rem;
    font-size: 0.85rem;
    margin-top: 0.5rem;
    width: 100%;
    outline: none;
    border: 1px solid rgba(255,255,255,0.8);
    font-family: inherit;
  }
  .pc-input:focus {
    border-color: #8fa8cc;
    background: white;
    box-shadow: 0 0 0 3px rgba(150, 170, 210, 0.25);
  }
  .pc-input::placeholder { color: #a8b6cc; }

  .crop-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100vw;
    height: 100vh;
    background: #ffffff;
    z-index: 99999;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .crop-overlay.active { display: flex; }

  .crop-overlay h3 {
    font-size: 1.2rem;
    color: #2c2c3a;
    margin-bottom: 16px;
    font-weight: 600;
  }

  .crop-stage {
    width: 480px;
    height: 480px;
    max-width: 80vw;
    max-height: 60vh;
    background: #2a2f3a;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    border: 2px solid #d0d5e0;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .crop-stage:active { cursor: grabbing; }
  .crop-stage canvas {
    display: block;
    position: absolute;
    top: 0; left: 0;
  }

  .crop-actions {
    display: flex;
    gap: 16px;
    margin-top: 24px;
  }
  .crop-actions button {
    border: none;
    border-radius: 2rem;
    padding: 0.75rem 2.2rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    font-family: inherit;
  }
  .crop-actions .cancel { background: #e8eaf0; color: #3f4a62; }
  .crop-actions .cancel:hover { background: #d8dbe5; }
  .crop-actions .confirm { background: #5b8def; color: #ffffff; }
  .crop-actions .confirm:hover { background: #4a7bdd; }

  .crop-hint {
    margin-top: 14px;
    font-size: 0.85rem;
    color: #8a93a8;
    text-align: center;
    line-height: 1.6;
  }
  .crop-hint b { color: #3f4a62; }

  .crop-zoom-bar {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.9rem;
    color: #3f4a62;
  }
  .crop-zoom-bar input[type="range"] {
    width: 220px;
    accent-color: #5b8def;
  }

  .font-upload-wrapper {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.85);
    border-radius: 2rem;
    padding: 0.2rem 0.8rem;
    border: 1px solid rgba(255,255,255,0.9);
  }
  .font-upload-wrapper label {
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.9rem;
    font-weight: 500;
    color: #3f4a62;
  }
  .font-upload-wrapper input[type="file"] { display: none; }

  @media (max-width: 900px) {
    .app { padding: 1.5rem 1rem; border-radius: 2rem; }
    .editable-title { font-size: 1.9rem; }
    .ho-table { min-width: 760px; }
  }

  @media (max-width: 640px) {
    body { padding: 0.8rem 0.5rem; }
    .app { padding: 1rem 0.8rem; border-radius: 1.5rem; }
    .title-section {
      flex-direction: column;
      align-items: stretch;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }
    .editable-title {
      font-size: 1.6rem;
      padding: 0.2rem 0.4rem;
      text-align: center;
    }
    .toolbar { justify-content: center; gap: 0.5rem; }
    .btn { padding: 0.55rem 1rem; font-size: 0.85rem; }
    .font-upload-wrapper { padding: 0.15rem 0.6rem; }
    .font-upload-wrapper label { font-size: 0.8rem; }

    .table-wrapper {
      padding: 0.3rem;
      border-radius: 1.2rem;
      overflow-x: visible;
    }

    .ho-table,
    .ho-table tbody,
    .ho-table tr,
    .ho-table td {
      display: block;
      width: 100%;
      min-width: 0;
    }
    .ho-table { border-spacing: 0; table-layout: auto; }

    .ho-row {
      background: rgba(255, 255, 255, 0.55);
      border-radius: 1.4rem;
      padding: 0.8rem;
      margin-bottom: 1rem;
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: 0 6px 18px -8px rgba(0,0,0,0.12);
    }

    .ho-row > td:first-child {
      width: 100% !important;
      margin-bottom: 0.6rem;
      text-align: left;
    }
    .ho-label { font-size: 1.05rem; padding: 0.4rem 1rem; }

    .ho-row > td:not(:first-child) {
      display: inline-block;
      width: calc(50% - 0.3rem);
      vertical-align: top;
      margin: 0.15rem;
    }

    @media (max-width: 380px) {
      .ho-row > td:not(:first-child) {
        width: 100%;
        margin: 0.2rem 0;
      }
    }

    .cell-card { padding: 0.7rem 0.7rem 0.8rem; border-radius: 1.2rem; }
    .avatar-preview { max-width: 80px; }
    .module-row { padding: 0.1rem 0.2rem 0.1rem 0.4rem; gap: 0.2rem; }
    .status-selector { font-size: 0.7rem; padding: 0.25rem 0.4rem; min-width: 60px; }
    .module-input { font-size: 0.82rem; padding: 0.4rem 0.1rem; }
    .pc-input { font-size: 0.8rem; padding: 0.4rem 0.6rem; }

    .crop-overlay h3 { font-size: 1.05rem; margin-bottom: 12px; }
    .crop-stage {
      width: 88vw;
      height: 88vw;
      max-height: 60vh;
      max-width: 60vh;
    }
    .crop-zoom-bar input[type="range"] { width: 150px; }
    .crop-actions { gap: 10px; margin-top: 16px; }
    .crop-actions button { padding: 0.6rem 1.4rem; font-size: 0.9rem; }
    .crop-hint { font-size: 0.75rem; margin-top: 10px; padding: 0 10px; }
  }
</style>
</head>
<body>
<div class="app" id="appContainer">
  <div class="title-section">
    <div class="editable-title" id="mainTitle" contenteditable="true" spellcheck="false">PC汇总</div>
    <div class="toolbar">
      <div class="font-upload-wrapper">
        <label for="fontUpload">上传字体</label>
        <input type="file" id="fontUpload" accept=".ttf,.otf,.woff,.woff2">
      </div>
      <button class="btn btn-primary" id="exportBtn">导出图片</button>
    </div>
  </div>

  <div class="table-wrapper" id="tableWrapper">
    <table class="ho-table" id="hoTable">
      <tbody id="hoTableBody"></tbody>
    </table>
  </div>

  <div style="display: flex; justify-content: center; margin-top: 1rem;">
    <button class="btn" id="addRowBtn">+ 增加 HO 行</button>
  </div>
</div>

<div class="crop-overlay" id="cropOverlay">
  <h3>裁剪头像</h3>
  <div class="crop-stage" id="cropStage">
    <canvas id="cropCanvas"></canvas>
  </div>
  <div class="crop-zoom-bar">
    <span>缩小</span>
    <input type="range" id="zoomSlider" min="0.2" max="3" step="0.01" value="1">
    <span>放大</span>
  </div>
  <div class="crop-actions">
    <button class="cancel" id="cancelCropBtn">取消</button>
    <button class="confirm" id="confirmCropBtn">应用裁剪</button>
  </div>
  <div class="crop-hint">
    <b>拖动图片</b> 移动位置 &nbsp;|&nbsp; <b>滚轮 / 滑块</b> 缩放 &nbsp;|&nbsp; 白色方框为裁剪区域
  </div>
</div>

<script>
(function() {
  'use strict';

  window.onerror = function(msg, url, line) {
    alert('页面出错：' + msg + '\n行号：' + line);
    return false;
  };

  var STATUS_OPTIONS = ['已通过', '未通过', '散桌', '卫星'];

  var STATUS_COLORS = {
    '已通过': { bg: '#dcf5e3', fg: '#1f7a44', border: '#a9e0be' },
    '未通过': { bg: '#fde0e0', fg: '#b33535', border: '#f5b5b5' },
    '散桌':   { bg: '#ffeacc', fg: '#b56d15', border: '#f5cfa0' },
    '卫星':   { bg: '#e4e0fb', fg: '#5a44b8', border: '#c3b8f0' }
  };

  var STATUS_CLASS = {
    '已通过': 'status-pass',
    '未通过': 'status-fail',
    '散桌':   'status-scatter',
    '卫星':   'status-satellite'
  };

  var tbody = document.getElementById('hoTableBody');

  function createHoRow(hoName) {
    var tr = document.createElement('tr');
    tr.className = 'ho-row';

    var tdHo = document.createElement('td');
    tdHo.style.verticalAlign = 'middle';
    tdHo.style.width = '110px';
    var hoSpan = document.createElement('div');
    hoSpan.className = 'ho-label';
    hoSpan.contentEditable = 'true';
    hoSpan.textContent = hoName;
    tdHo.appendChild(hoSpan);
    tr.appendChild(tdHo);

    for (var i = 0; i < 5; i++) {
      var td = document.createElement('td');
      td.style.verticalAlign = 'top';
      td.appendChild(createCellCard());
      tr.appendChild(td);
    }
    return tr;
  }

  function applyStatusStyle(selectEl) {
    Object.keys(STATUS_CLASS).forEach(function(k) {
      selectEl.classList.remove(STATUS_CLASS[k]);
    });
    var cls = STATUS_CLASS[selectEl.value];
    if (cls) selectEl.classList.add(cls);
  }

  function createCellCard() {
    var card = document.createElement('div');
    card.className = 'cell-card';

    var avatarArea = document.createElement('div');
    avatarArea.className = 'avatar-area';

    var avatarPreview = document.createElement('div');
    avatarPreview.className = 'avatar-preview';

    var placeholder = document.createElement('div');
    placeholder.className = 'avatar-placeholder';
    placeholder.innerHTML = '<div class="icon-cam"></div><span>上传头像</span>';
    avatarPreview.appendChild(placeholder);

    avatarArea.appendChild(avatarPreview);
    card.appendChild(avatarArea);

    var moduleRow = document.createElement('div');
    moduleRow.className = 'module-row';

    var statusSelect = document.createElement('select');
    statusSelect.className = 'status-selector';
    STATUS_OPTIONS.forEach(function(v) {
      var option = document.createElement('option');
      option.value = v;
      option.textContent = v;
      statusSelect.appendChild(option);
    });
    applyStatusStyle(statusSelect);
    statusSelect.addEventListener('change', function() {
      applyStatusStyle(statusSelect);
    });
    moduleRow.appendChild(statusSelect);

    var moduleInput = document.createElement('input');
    moduleInput.type = 'text';
    moduleInput.className = 'module-input';
    moduleInput.placeholder = '模组名';
    moduleRow.appendChild(moduleInput);

    card.appendChild(moduleRow);

    var pcInput = document.createElement('input');
    pcInput.type = 'text';
    pcInput.className = 'pc-input';
    pcInput.placeholder = 'PC 名';
    card.appendChild(pcInput);

    avatarPreview.addEventListener('click', function(e) {
      e.stopPropagation();
      var fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = 'image/*';
      fileInput.onchange = function(ev) {
        var file = ev.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(loadEv) {
          openCropper(loadEv.target.result, avatarPreview);
        };
        reader.readAsDataURL(file);
      };
      fileInput.click();
    });

    return card;
  }

  var overlay = document.getElementById('cropOverlay');
  var stage = document.getElementById('cropStage');
  var canvas = document.getElementById('cropCanvas');
  var ctx = canvas.getContext('2d');
  var zoomSlider = document.getElementById('zoomSlider');

  var currentPreview = null;
  var baseImg = null;
  var iScale = 1;
  var iOffX = 0, iOffY = 0;
  var dragging = false;
  var dsX = 0, dsY = 0, dOffX = 0, dOffY = 0;
  var stageW = 480, stageH = 480;
  var cropSize = 336, cropX = 72, cropY = 72;

  var pinchStartDist = 0;
  var pinchStartScale = 1;

  function openCropper(dataUrl, previewEl) {
    overlay.classList.add('active');
    currentPreview = previewEl;

    var rect = stage.getBoundingClientRect();
    stageW = Math.round(rect.width) || 480;
    stageH = Math.round(rect.height) || 480;
    canvas.width = stageW;
    canvas.height = stageH;

    cropSize = Math.min(stageW, stageH) * 0.7;
    cropX = (stageW - cropSize) / 2;
    cropY = (stageH - cropSize) / 2;

    baseImg = new Image();
    baseImg.onload = function() {
      var iw = baseImg.naturalWidth;
      var ih = baseImg.naturalHeight;
      var coverScale = Math.max(cropSize / iw, cropSize / ih);
      iScale = coverScale;
      zoomSlider.value = 1;

      iOffX = cropX + cropSize / 2 - (iw * iScale) / 2;
      iOffY = cropY + cropSize / 2 - (ih * iScale) / 2;

      render();
    };
    baseImg.onerror = function() {
      alert('图片加载失败，请换一张试试。');
    };
    baseImg.src = dataUrl;
  }

  function render() {
    if (!baseImg) return;
    ctx.clearRect(0, 0, stageW, stageH);

    var iw = baseImg.naturalWidth * iScale;
    var ih = baseImg.naturalHeight * iScale;
    ctx.drawImage(baseImg, iOffX, iOffY, iw, ih);

    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.beginPath();
    ctx.rect(0, 0, stageW, stageH);
    ctx.rect(cropX + cropSize, cropY, -cropSize, cropSize);
    ctx.fill('evenodd');
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.strokeRect(cropX, cropY, cropSize, cropSize);

    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 1;
    var th = cropSize / 3;
    for (var i = 1; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(cropX + th * i, cropY);
      ctx.lineTo(cropX + th * i, cropY + cropSize);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cropX, cropY + th * i);
      ctx.lineTo(cropX + cropSize, cropY + th * i);
      ctx.stroke();
    }

    ctx.fillStyle = '#ffffff';
    var hs = 10;
    [[cropX, cropY], [cropX + cropSize, cropY], [cropX, cropY + cropSize], [cropX + cropSize, cropY + cropSize]].forEach(function(p) {
      ctx.fillRect(p[0] - hs / 2, p[1] - hs / 2, hs, hs);
    });

    ctx.restore();
  }

  function getPos(e) {
    var rect = stage.getBoundingClientRect();
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }

  function onDown(e) {
    e.preventDefault();
    if (e.touches && e.touches.length === 2) {
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchStartDist = Math.sqrt(dx * dx + dy * dy);
      pinchStartScale = iScale;
      dragging = false;
      return;
    }
    dragging = true;
    var p = getPos(e);
    dsX = p.x; dsY = p.y;
    dOffX = iOffX; dOffY = iOffY;
  }

  function onMove(e) {
    if (e.touches && e.touches.length === 2 && pinchStartDist > 0) {
      e.preventDefault();
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var factor = dist / pinchStartDist;
      var newScale = pinchStartScale * factor;
      newScale = Math.max(0.1, Math.min(5, newScale));
      var ratio = newScale / iScale;

      var cx = cropX + cropSize / 2;
      var cy = cropY + cropSize / 2;
      iOffX = cx - (cx - iOffX) * ratio;
      iOffY = cy - (cy - iOffY) * ratio;
      iScale = newScale;

      if (baseImg) {
        var iw = baseImg.naturalWidth;
        var ih = baseImg.naturalHeight;
        var cs = Math.max(cropSize / iw, cropSize / ih);
        zoomSlider.value = (iScale / cs).toFixed(2);
      }
      render();
      return;
    }

    if (!dragging) return;
    e.preventDefault();
    var p = getPos(e);
    iOffX = dOffX + (p.x - dsX);
    iOffY = dOffY + (p.y - dsY);
    render();
  }

  function onUp(e) {
    if (e && e.touches && e.touches.length < 2) {
      pinchStartDist = 0;
    }
    dragging = false;
  }

  stage.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  stage.addEventListener('touchstart', onDown, { passive: false });
  stage.addEventListener('touchmove', onMove, { passive: false });
  stage.addEventListener('touchend', onUp);
  stage.addEventListener('touchcancel', onUp);

  stage.addEventListener('wheel', function(e) {
    e.preventDefault();
    if (!baseImg) return;
    var old = iScale;
    var factor = e.deltaY < 0 ? 1.1 : 0.9;
    var ns = old * factor;
    ns = Math.max(0.1, Math.min(5, ns));

    var rect = stage.getBoundingClientRect();
    var mx = e.clientX - rect.left;
    var my = e.clientY - rect.top;
    var r = ns / old;
    iOffX = mx - (mx - iOffX) * r;
    iOffY = my - (my - iOffY) * r;
    iScale = ns;

    var iw = baseImg.naturalWidth;
    var ih = baseImg.naturalHeight;
    var cs = Math.max(cropSize / iw, cropSize / ih);
    zoomSlider.value = (iScale / cs).toFixed(2);
    render();
  }, { passive: false });

  zoomSlider.addEventListener('input', function() {
    if (!baseImg) return;
    var iw = baseImg.naturalWidth;
    var ih = baseImg.naturalHeight;
    var cs = Math.max(cropSize / iw, cropSize / ih);
    var ns = cs * parseFloat(zoomSlider.value);

    var cx = cropX + cropSize / 2;
    var cy = cropY + cropSize / 2;
    var r = ns / iScale;
    iOffX = cx - (cx - iOffX) * r;
    iOffY = cy - (cy - iOffY) * r;
    iScale = ns;
    render();
  });

  document.getElementById('cancelCropBtn').addEventListener('click', function() {
    overlay.classList.remove('active');
    baseImg = null;
    currentPreview = null;
  });

  document.getElementById('confirmCropBtn').addEventListener('click', function() {
    if (!baseImg || !currentPreview) return;

    var OUT = 200;
    var outCanvas = document.createElement('canvas');
    outCanvas.width = OUT;
    outCanvas.height = OUT;
    var octx = outCanvas.getContext('2d');

    var sx = (cropX - iOffX) / iScale;
    var sy = (cropY - iOffY) / iScale;
    var ss = cropSize / iScale;

    octx.drawImage(baseImg, sx, sy, ss, ss, 0, 0, OUT, OUT);

    var dataUrl = outCanvas.toDataURL('image/jpeg', 0.9);
    currentPreview.innerHTML = '';
    var newImg = document.createElement('img');
    newImg.src = dataUrl;
    currentPreview.appendChild(newImg);

    overlay.classList.remove('active');
    baseImg = null;
    currentPreview = null;
  });

  for (var i = 1; i <= 4; i++) {
    tbody.appendChild(createHoRow('HO' + i));
  }

  document.getElementById('addRowBtn').addEventListener('click', function() {
    tbody.appendChild(createHoRow('HO' + (tbody.children.length + 1)));
  });

  document.getElementById('fontUpload').addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      var fontName = 'CustomFont_' + Date.now();
      var style = document.createElement('style');
      style.textContent = '@font-face { font-family: "' + fontName + '"; src: url("' + ev.target.result + '"); } ' +
        'body, .app, .app * { font-family: "' + fontName + '", "Segoe UI", "Microsoft YaHei", sans-serif !important; }';
      document.head.appendChild(style);
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('exportBtn').addEventListener('click', function() {
    exportAsImage();
  });

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
  }

  function drawAvatarPlaceholder(c, cx, cy, size) {
    c.save();
    c.beginPath();
    c.arc(cx, cy, size / 2, 0, Math.PI * 2);
    c.closePath();
    c.fillStyle = '#eef2fa';
    c.fill();
    c.strokeStyle = '#c8d2e6';
    c.lineWidth = 2;
    c.stroke();

    c.fillStyle = '#a8b6cc';
    c.beginPath();
    c.arc(cx, cy + 4, 12, 0, Math.PI * 2);
    c.fill();
    c.fillRect(cx - 16, cy - 10, 32, 10);
    c.restore();
  }

  function exportAsImage() {
    var rows = tbody.querySelectorAll('tr.ho-row');
    var rowDataList = [];

    rows.forEach(function(row) {
      var hoLabel = row.querySelector('.ho-label').textContent.trim();
      var cells = row.querySelectorAll('td:not(:first-child) .cell-card');
      var cellDataList = [];
      var rowHasContent = false;

      cells.forEach(function(card) {
        var status = card.querySelector('.status-selector').value;
        var module = card.querySelector('.module-input').value.trim();
        var pc = card.querySelector('.pc-input').value.trim();
        var avatarImg = card.querySelector('.avatar-preview img');
        var hasContent = (module !== '' || pc !== '' || avatarImg !== null);
        if (hasContent) rowHasContent = true;

        cellDataList.push({
          status: status,
          module: module,
          pc: pc,
          avatarImg: avatarImg,
          hasContent: hasContent
        });
      });

      if (rowHasContent) {
        rowDataList.push({ hoLabel: hoLabel, cells: cellDataList });
      }
    });

    if (rowDataList.length === 0) {
      alert('表格是空的，没有内容可以导出。');
      return;
    }

    var PAD = 40;
    var TITLE_H = 80;
    var CELL_W = 220;
    var CELL_H = 240;
    var GAP = 16;
    var HO_W = 110;
    var ROW_H = CELL_H + GAP;
    var MAX_COLS = 5;

    var contentW = HO_W + GAP + MAX_COLS * (CELL_W + GAP);
    var contentH = rowDataList.length * ROW_H;

    var canvasW = PAD * 2 + contentW;
    var canvasH = PAD * 2 + TITLE_H + contentH;

    var outCanvas = document.createElement('canvas');
    outCanvas.width = canvasW;
    outCanvas.height = canvasH;
    var c = outCanvas.getContext('2d');

    var grad = c.createLinearGradient(0, 0, canvasW, canvasH);
    grad.addColorStop(0, '#f0f4fe');
    grad.addColorStop(1, '#ffffff');
    c.fillStyle = grad;
    c.fillRect(0, 0, canvasW, canvasH);

    var title = document.getElementById('mainTitle').textContent.trim() || 'PC汇总';
    c.fillStyle = '#2c2c3a';
    c.font = 'bold 42px "Segoe UI", "Microsoft YaHei", sans-serif';
    c.textBaseline = 'middle';
    c.textAlign = 'left';
    c.fillText(title, PAD, PAD + TITLE_H / 2);

    var startY = PAD + TITLE_H;

    rowDataList.forEach(function(rowData, rowIdx) {
      var rowY = startY + rowIdx * ROW_H;

      c.fillStyle = '#2c2c3a';
      c.font = 'bold 20px "Segoe UI", "Microsoft YaHei", sans-serif';
      c.textBaseline = 'middle';
      c.textAlign = 'left';
      c.fillText(rowData.hoLabel, PAD, rowY + CELL_H / 2);

      rowData.cells.forEach(function(cell, colIdx) {
        if (!cell.hasContent) return;

        var cellX = PAD + HO_W + GAP + colIdx * (CELL_W + GAP);
        var cellY = rowY;

        c.save();
        roundRect(c, cellX, cellY, CELL_W, CELL_H, 20);
        c.fillStyle = '#ffffff';
        c.fill();
        c.strokeStyle = '#dfe5f0';
        c.lineWidth = 1;
        c.stroke();
        c.restore();

        var avatarSize = 90;
        var avatarCx = cellX + CELL_W / 2;
        var avatarCy = cellY + 22 + avatarSize / 2;

        if (cell.avatarImg && cell.avatarImg.src) {
          try {
            c.save();
            c.beginPath();
            c.arc(avatarCx, avatarCy, avatarSize / 2, 0, Math.PI * 2);
            c.closePath();
            c.clip();
            c.drawImage(cell.avatarImg, avatarCx - avatarSize / 2, avatarCy - avatarSize / 2, avatarSize, avatarSize);
            c.restore();
          } catch (err) {
            drawAvatarPlaceholder(c, avatarCx, avatarCy, avatarSize);
          }
        } else {
          drawAvatarPlaceholder(c, avatarCx, avatarCy, avatarSize);
        }

        var colors = STATUS_COLORS[cell.status] || STATUS_COLORS['已通过'];
        var badgeY = cellY + 22 + avatarSize + 20;
        var badgeText = cell.status;
        c.font = 'bold 13px "Segoe UI", "Microsoft YaHei", sans-serif';
        var textW = c.measureText(badgeText).width;
        var badgePadX = 12;
        var badgeW = textW + badgePadX * 2;
        var badgeH = 24;
        var badgeX = cellX + 16;
        var badgeYTop = badgeY - badgeH / 2;

        c.save();
        roundRect(c, badgeX, badgeYTop, badgeW, badgeH, badgeH / 2);
        c.fillStyle = colors.bg;
        c.fill();
        c.strokeStyle = colors.border;
        c.lineWidth = 1;
        c.stroke();
        c.restore();

        c.fillStyle = colors.fg;
        c.textBaseline = 'middle';
        c.textAlign = 'left';
        c.fillText(badgeText, badgeX + badgePadX, badgeY + 1);

        c.font = '15px "Segoe UI", "Microsoft YaHei", sans-serif';
        c.fillStyle = '#2c2c3a';
        c.textAlign = 'left';
        c.textBaseline = 'middle';
        var moduleText = cell.module || '(未填写模组)';
        if (moduleText.length > 11) moduleText = moduleText.slice(0, 11) + '…';
        c.fillText(moduleText, cellX + 16, badgeY + 28);

        c.font = '14px "Segoe UI", "Microsoft YaHei", sans-serif';
        c.fillStyle = '#5a6b8c';
        var pcText = cell.pc || '(未填写 PC)';
        if (pcText.length > 14) pcText = pcText.slice(0, 14) + '…';
        c.fillText(pcText, cellX + 16, badgeY + 52);
      });
    });

    try {
      var dataUrl = outCanvas.toDataURL('image/png');
      var link = document.createElement('a');
      link.download = 'PC汇总_' + new Date().toISOString().slice(0, 10) + '.png';
      link.href = dataUrl;
      link.click();
    } catch (err) {
      alert('导出失败：' + err.message);
    }
  }

})();
</script>
</body>
</html>
